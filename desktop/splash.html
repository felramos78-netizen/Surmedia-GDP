<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GDP Surmedia</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #016D8C; color: #fff; font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    -webkit-app-region: drag; user-select: none;
  }
  .logo { width: 64px; height: 64px; border-radius: 14px; background: #fff; color: #016D8C;
          font-size: 34px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  #version { position: fixed; bottom: 10px; right: 14px; font-size: 11px; opacity: .6; }
  #status { font-size: 13px; opacity: .85; min-height: 18px; }
  .bar { width: 180px; height: 3px; background: rgba(255,255,255,.25); border-radius: 2px; overflow: hidden; }
  .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #fff; border-radius: 2px;
                animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%) } to { transform: translateX(250%) } }
</style>
</head>
<body>
  <div class="logo">S</div>
  <h1>Gestión de Personas</h1>
  <div class="bar"></div>
  <div id="status">Iniciando…</div>
  <div id="version"></div>
  <script>
    const v = new URLSearchParams(location.search).get('v')
    if (v) document.getElementById('version').textContent = 'Versión ' + v
    window.setStatus = t => { document.getElementById('status').textContent = t }</script>
</body>
</html>
